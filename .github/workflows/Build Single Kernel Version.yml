name: Build Single Kernel Version

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: "Android version"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android14
      kernel_version:
        description: "Kernel version"
        required: true
        type: choice
        options:
          - "5.10"
          - 5.15
          - 6.1
          - 6.6
          - 6.12
        default: 5.10
      sublevel:
        description: "Kernel sublevel (e.g., 210, 211, 212, etc.)"
        required: true
        type: string
        default: "212"
      os_patch_level:
        description: "OS patch level (e.g., 2025-01, 2025-02, etc.)"
        required: true
        type: string
        default: "2025-01"
      variant:
        description: "Build variant"
        type: choice
        options:
          - Normal
          - gki
        default: Normal
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - KSUN+SUSFS+BBG+NET+DS
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS+NET
          - KSUN+SUSFS+DS
          - KSUN+SUSFS
          - KSUN+BBG
          - KSUN+NET
          - KSUN+DS
          - KSUN
          - NONE
          - FULL
        default: FULL
      use_repo:
        description: "Use repo for downloading kernel source"
        type: boolean
        default: true
      use_latest_commits:
        description: "Use branch tip for KernelSU and SUSFS instead of pinned commits"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  build-single:
    uses: ./.github/workflows/build.yml
    with:
      version: '${{ inputs.android_version }}-${{ inputs.kernel_version }}'
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sublevel: ${{ inputs.sublevel }}
      os_patch_level: ${{ inputs.os_patch_level }}
      variant: ${{ inputs.variant }}
      feature_set: ${{ inputs.feature_set }}
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit
